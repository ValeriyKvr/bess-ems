[project]
name = "bess-sim"
version = "0.1.0"
description = "BESS Physics and Protocol Simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bess_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
