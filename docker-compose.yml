services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bess-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mosquitto:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    container_name: bess-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 2 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  ems:
    build:
      context: ./ems
      dockerfile: Dockerfile
    container_name: bess-ems
    restart: unless-stopped
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-ems}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      EMS_HOST: 0.0.0.0
      EMS_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  bess-sim:
    build:
      context: ./bess-sim
      dockerfile: Dockerfile
    container_name: bess-sim
    restart: unless-stopped
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      BESS_ID: ${BESS_ID:-bess-01}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "5020:5020"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; exit(0 if os.path.exists('/tmp/healthy') else 1)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bess-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      ems:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  mosquitto_data:
